<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="できたよ">
<meta name="theme-color" content="#F1F8FF">
<title>できたよ チャレンジ｜MieeL</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
  /* ============================================================
     できたよ チャレンジ  見た目（CSS）
     ============================================================ */
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --bg: #F1F8FF; --ink: #1F2937; --sub: #6B7280; --line: #D6E4F0;
    --go: #2F9E44; --go-d: #237A34; --main: #1C7ED6; --main-d: #1864AB; --orange: #F76707;
    --yellow: #FFD43B; --gold: #FAB005; --pink: #F06595; --violet: #7048E8;
    --emoji: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-weight: 700; word-break: keep-all; overflow-wrap: anywhere; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  /* ---------- 上のバー ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 76px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 4px 18px 4px 8px; border-radius: 999px; background: #fff; border: 3px solid var(--line); font-size: 22px; }
  .chip .ic { font-size: 34px; line-height: 1; font-family: var(--emoji); }
  .chip[hidden] { display: none; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: #8AA4BF; font-size: 16px; letter-spacing: .1em; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); letter-spacing: .02em; }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  .mieel-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid #E9ECEF; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.8; }
  .mieel-foot .mieel-brand { justify-content: center; }
  .mieel-foot a { color: var(--main); font-weight: 700; text-decoration: none; font-size: 14px; }
  @media (max-width: 699px) { .topbar .mieel-brand .url { display: none; } }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--main); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 20px 20px; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .shake { animation: shake .45s; }
  .title { font-size: clamp(30px, 4.6vw, 52px); text-align: center; margin: 0 0 clamp(8px, 2vh, 16px); }

  .pic { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
  .pic .emoji { font-family: var(--emoji); line-height: 1; font-size: clamp(48px, 8vw, 90px); font-weight: 400; }
  .pic .letter { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; background: var(--main); color: #fff; font-size: clamp(28px, 4vw, 52px); }

  .actions { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big-btn { min-width: min(400px, 78vw); min-height: 96px; padding: 0 40px; border: none; border-radius: 999px; color: #fff; font-size: clamp(28px, 3.8vw, 44px); display: flex; align-items: center; justify-content: center; gap: 14px; }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.blue { background: var(--main); box-shadow: 0 8px 0 var(--main-d); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .big-btn.dim { opacity: .45; }
  .round-btn { width: 88px; height: 88px; border-radius: 50%; border: 4px solid var(--line); background: #fff; font-size: 40px; box-shadow: 0 5px 0 var(--line); display: grid; place-items: center; }
  .round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .back-btn { height: 68px; padding: 0 26px; border-radius: 999px; border: 4px solid #ADB5BD; background: #fff; color: #495057; font-size: 24px; box-shadow: 0 5px 0 #DEE2E6; }

  /* ---------- だれ？／どれ？ ---------- */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; overflow-y: auto; flex: 1; align-content: start; padding: 6px; }
  .pcard { background: #fff; border: 6px solid var(--line); border-radius: 30px; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: clamp(22px, 2.6vw, 30px); box-shadow: 0 6px 0 rgba(0,0,0,.08); text-align: center; }
  .pcard .ic { font-size: clamp(64px, 8vw, 96px); line-height: 1.1; font-family: var(--emoji); font-weight: 400; }
  .pcard small { font-size: 16px; color: var(--sub); }
  .pcard.done { border-color: var(--gold); background: #FFF9DB; }
  .pcard:active { transform: translateY(4px); }

  /* ---------- スタート（見とおし） ---------- */
  .start { justify-content: center; align-items: center; gap: clamp(8px, 1.6vh, 16px); }
  .sched { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
  .scard { width: clamp(124px, 14vw, 170px); background: #fff; border: 5px solid var(--main); border-radius: 22px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; box-shadow: 0 5px 0 rgba(0,0,0,.07); }
  .scard .no { position: absolute; top: -12px; left: -10px; width: 34px; height: 34px; border-radius: 50%; background: var(--main); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .scard .pic { width: 100%; height: clamp(58px, 10vh, 96px); }
  .scard .pic .emoji { font-size: clamp(46px, min(6vw, 8vh), 74px); }
  .scard .nm { font-size: clamp(15px, 1.7vw, 19px); text-align: center; line-height: 1.3; }
  .scard .cnt { font-size: 15px; color: var(--sub); }
  .then { font-size: clamp(24px, 3vw, 36px); color: var(--pink); }
  .reward-box { background: #fff; border-radius: 30px; border: 5px dashed var(--pink); padding: 10px 22px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; }
  .rlabel { font-size: clamp(20px, 2.6vw, 28px); }
  .rgrid { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .rcard { width: clamp(120px, 14vw, 170px); border: 5px solid #F8D7E3; border-radius: 24px; background: #FFF5F9; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: clamp(17px, 2vw, 22px); text-align: center; transition: transform .15s; }
  .rcard .pic { width: 100%; height: clamp(56px, 9vh, 96px); }
  .rcard .pic .emoji { font-size: clamp(48px, min(6vw, 8vh), 76px); }
  .rcard.sel { border-color: var(--pink); background: #FFDEEB; transform: scale(1.07); box-shadow: 0 0 0 5px var(--ink); }
  .rcard.fixed { border-color: var(--pink); }
  .empty-msg { flex: 1; display: grid; place-items: center; text-align: center; font-size: 28px; line-height: 1.8; color: var(--sub); }
  .empty-msg small { display: block; font-size: 20px; }

  /* ---------- じゅんばん・かいすう ---------- */
  .play { gap: clamp(6px, 1.2vh, 12px); }
  .mission-bar { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .mtext { font-size: clamp(28px, 4vw, 48px); text-align: center; }
  .remain { font-size: clamp(22px, 2.8vw, 32px); background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 22px; white-space: nowrap; }
  .remain.last { background: var(--orange); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .track { position: relative; display: flex; align-items: center; padding: clamp(46px, 7vh, 62px) 8px 6px; }
  .stop { flex: 1; display: flex; justify-content: center; position: relative; min-width: 0; }
  .stop::before { content: ""; position: absolute; top: 50%; right: 50%; width: 100%; height: 8px; background: var(--line); transform: translateY(-50%); border-radius: 8px; }
  .stop:first-child::before { display: none; }
  .stop.done::before { background: var(--gold); }
  .dot { position: relative; z-index: 1; width: clamp(32px, 5.2vw, 64px); aspect-ratio: 1; border-radius: 50%; background: #fff; border: 5px solid var(--line); display: grid; place-items: center; font-size: clamp(15px, 2.6vw, 32px); line-height: 1; font-family: var(--emoji); font-weight: 400; overflow: hidden; }
  .dot img { width: 100%; height: 100%; object-fit: cover; }
  .dot > span { filter: grayscale(1); opacity: .55; }
  .stop.done .dot { border-color: var(--gold); background: #FFF3BF; }
  .stop.done .dot > span, .stop.start .dot > span, .stop.now .dot > span { filter: none; opacity: 1; }
  .stop.now .dot { border-color: var(--main); box-shadow: 0 0 0 4px rgba(28,126,214,.25); }
  .stop.goal .dot { width: clamp(42px, 6.6vw, 80px); border-color: var(--pink); }
  .stop.goal.done .dot { background: #FFDEEB; }
  .stop.goal .dot > span { filter: none; opacity: 1; }
  .stop.justdone .dot { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  .runner { position: absolute; top: 2px; left: 0; transform: translateX(-50%); font-size: clamp(36px, 5.6vw, 62px); line-height: 1; transition: left .6s cubic-bezier(.3, 1.4, .5, 1); font-family: var(--emoji); z-index: 2; font-weight: 400; }
  .runner.hop { animation: hop .6s ease-out; }
  @keyframes hop { 35% { top: -34px; } 70% { top: 6px; } }
  .pbar { height: 30px; border-radius: 15px; background: #fff; border: 4px solid var(--line); overflow: hidden; margin: 6px 8px; position: relative; }
  .pbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #FFE066, var(--gold)); transition: width .5s; }
  .pbar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; }

  .play-main { flex: 1; display: flex; gap: clamp(16px, 4vw, 56px); align-items: center; justify-content: center; min-height: 0; }
  .act-card { width: min(38vw, 44vh, 420px); aspect-ratio: 1; background: #fff; border: 8px solid var(--main); border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .act-card .pic { width: 100%; flex: 1; min-height: 0; }
  .act-card .pic .emoji { font-size: clamp(90px, min(16vw, 21vh), 210px); }
  .act-card .aname { font-size: clamp(24px, 3.2vw, 40px); text-align: center; line-height: 1.3; }
  .done-btn { position: relative; width: min(36vw, 44vh, 400px); aspect-ratio: 1; border-radius: 50%; border: none; color: #fff; background: radial-gradient(circle at 35% 28%, #69DB7C, #2F9E44 70%); box-shadow: 0 12px 0 var(--go-d), 0 20px 34px rgba(47, 158, 68, .3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
  .done-btn .bemoji { font-size: clamp(60px, min(9vw, 11vh), 120px); line-height: 1; font-family: var(--emoji); font-weight: 400; }
  .done-btn .blabel { font-size: clamp(32px, min(5vw, 6.5vh), 64px); text-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .done-btn:active { transform: translateY(8px); box-shadow: 0 4px 0 var(--go-d); }
  .done-btn.locked { filter: saturate(.3) brightness(1.08); }
  .done-btn::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255,255,255,.4); }
  .done-btn.holding::after { animation: holdfill .7s linear forwards; }
  @keyframes holdfill { to { height: 100%; } }
  .done-btn .holdhint { font-size: 16px; opacity: .9; }

  .play-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
  .undo { position: relative; border: none; background: transparent; font-size: 17px; padding: 12px 14px; opacity: .45; border-radius: 12px; }
  .undo.pressing { opacity: 1; background: #fff; }
  .reward-mini { display: flex; align-items: center; gap: 8px; font-size: 20px; background: #fff; border: 3px dashed var(--pink); border-radius: 999px; padding: 4px 18px 4px 6px; }
  .reward-mini .pic { width: 46px; height: 46px; }
  .reward-mini .pic .emoji { font-size: 34px; }

  /* じかんの めやす（えんばん） */
  .tmr { display: flex; align-items: center; gap: 8px; font-size: 20px; background: #fff; border-radius: 999px; padding: 4px 16px 4px 4px; border: 3px solid var(--line); }
  .tmr svg { width: 46px; height: 46px; }
  .tmr.over { border-color: var(--orange); }

  /* ---------- もちもの チェック ---------- */
  .pack-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(14px, 3vw, 36px); align-items: center; min-height: 0; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 17vw, 210px), 1fr)); gap: 14px; align-content: center; overflow-y: auto; padding: 8px; max-height: 100%; }
  .icard { position: relative; background: #fff; border: 6px solid var(--main); border-radius: 26px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 var(--main-d); }
  .icard .pic { width: 100%; height: clamp(80px, 14vh, 140px); }
  .icard .pic .emoji { font-size: clamp(64px, min(9vw, 11vh), 110px); }
  .icard .nm { font-size: clamp(19px, 2.3vw, 26px); text-align: center; line-height: 1.25; }
  .icard:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--main-d); }
  .icard.ok { border-color: var(--go); background: #EBFBEE; box-shadow: none; transform: none; }
  .icard.ok .pic { opacity: .35; }
  .icard.ok::after { content: "✔"; position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(60px, 9vw, 100px); color: var(--go); text-shadow: 0 3px 0 #fff; }
  .bagbox { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bag { font-family: var(--emoji); font-weight: 400; font-size: clamp(130px, min(20vw, 28vh), 240px); line-height: 1; transition: transform .2s; }
  .bag.bump { animation: bump .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump { 40% { transform: scale(1.15) rotate(-4deg); } }
  .bagcnt { font-size: clamp(24px, 3vw, 34px); background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 22px; }
  .flyitem { position: fixed; z-index: 41; pointer-events: none; font-family: var(--emoji); font-weight: 400; transition: transform .55s cubic-bezier(.5, -0.3, .7, 1), opacity .55s; }

  /* ほめる演出 */
  .praise { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: clamp(60px, 10vw, 130px); font-weight: 900; color: var(--orange); white-space: nowrap; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,.12); pointer-events: none; z-index: 40; animation: praise 1.2s ease-out forwards; }
  @keyframes praise { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 70% { transform: translate(-50%, -54%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%) scale(1); opacity: 0; } }
  .fly { position: fixed; font-size: 46px; pointer-events: none; z-index: 39; animation: fly .9s ease-out forwards; font-family: var(--emoji); }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.5) rotate(var(--r)); opacity: 0; } }
  .confetti { position: fixed; top: -50px; pointer-events: none; z-index: 38; animation: fall linear forwards; font-family: var(--emoji); }
  @keyframes fall { to { transform: translateY(115vh) rotate(var(--r)); } }
  .overlay { position: fixed; inset: 0; background: rgba(241, 248, 255, .93); display: grid; place-items: center; z-index: 45; animation: fadein .2s; }
  .ov-card { background: #fff; border: 8px solid var(--gold); border-radius: 40px; padding: 28px 48px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); max-width: 92vw; }
  .ov-card .big { font-size: clamp(36px, 5.4vw, 64px); color: var(--go); }
  .ov-card .next { font-size: clamp(24px, 3.2vw, 38px); }
  .ov-card .pic { width: clamp(120px, 22vh, 190px); height: clamp(120px, 22vh, 190px); }
  .ov-card .pic .emoji { font-size: clamp(90px, 16vh, 150px); }

  /* ---------- クリア ---------- */
  .goal { justify-content: center; align-items: center; gap: clamp(8px, 2vh, 20px); text-align: center; }
  .goal h1 { font-size: clamp(48px, 8vw, 100px); margin: 0; color: var(--orange); -webkit-text-stroke: 3px #fff; paint-order: stroke fill; }
  .goal .sub { font-size: clamp(24px, 3.2vw, 38px); }
  .goal-row { display: flex; gap: clamp(16px, 4vw, 48px); align-items: stretch; flex-wrap: wrap; justify-content: center; }
  .gbox { background: #fff; border-radius: 32px; border: 6px solid var(--pink); padding: 14px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 250px; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .gbox.st { border-color: var(--gold); animation-delay: .25s; }
  .gbox .lbl { font-size: clamp(20px, 2.6vw, 28px); color: var(--sub); }
  .gbox .pic { width: clamp(110px, 20vh, 180px); height: clamp(110px, 20vh, 180px); }
  .gbox .pic .emoji { font-size: clamp(90px, 16vh, 150px); }
  .gbox .nm { font-size: clamp(26px, 3.4vw, 42px); }
  .sticker-big { font-size: clamp(100px, 18vh, 160px); line-height: 1.1; animation: spinin 1.1s cubic-bezier(.2, 1.3, .4, 1) .3s both; font-family: var(--emoji); font-weight: 400; }
  @keyframes spinin { from { transform: rotate(-540deg) scale(0); } to { transform: none; } }
  .goal .time { font-size: 20px; color: var(--sub); }

  /* ---------- シールちょう ---------- */
  .book { gap: 12px; }
  .book-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .book-head h1 { flex: 1; margin: 0; text-align: center; font-size: clamp(28px, 4vw, 48px); }
  .count { font-size: 22px; background: #fff; border-radius: 999px; padding: 6px 18px; border: 3px solid var(--gold); }
  .sgrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: clamp(8px, 1.2vw, 14px); overflow-y: auto; flex: 1; align-content: start; padding: 4px; }
  .slot { aspect-ratio: 1; border-radius: 22px; background: #fff; border: 4px solid var(--line); display: grid; place-items: center; font-size: clamp(34px, min(5vw, 7vh), 66px); position: relative; font-family: var(--emoji); }
  .slot.no { background: #E7EEF5; color: #B9C7D6; font-size: clamp(26px, 3.6vw, 44px); font-family: inherit; }
  .slot .n { position: absolute; right: 6px; bottom: 4px; font-size: 15px; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 8px; font-family: inherit; }
  .slot.new { border-color: var(--gold); box-shadow: 0 0 0 5px #FFE066; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }

  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (orientation: portrait) {
    .play-main { flex-direction: column; gap: 18px; }
    .act-card { width: min(56vw, 30vh, 380px); }
    .done-btn { width: min(62vw, 32vh, 380px); }
    .pack-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .bag { font-size: clamp(100px, 16vh, 170px); }
    .sgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }

  /* ---------- 先生用：設定 ---------- */

  /* ---- かきだし・よみこみ ---- */
  function download(name, text, type) {
    const blob = new Blob([text], { type: type }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportCsv(P) {
    const rows = [['なまえ', '日にち', '時刻', 'チャレンジ', 'こ', 'かかった秒']].concat(P.log.map(l => [P.name, l.d, l.at || '', l.name, l.n, l.sec || 0]));
    download('dekitayo-' + P.name + '-' + today() + '.csv', '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n'), 'text/csv');
  }
  function exportAll() { download('dekitayo-' + today() + '.json', JSON.stringify({ app: 'dekitayo-challenge', version: 1, store: store }), 'application/json'); }
  function importAll(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(String(r.result)); if (!obj || !obj.store) throw new Error();
        if (!confirm('いまの せっていを、ファイルの 中身で おきかえますか？')) return;
        store = normalizeStore(obj.store); editPid = store.currentId; editCid = null; persist(); refresh(); toast('よみこみました');
      } catch (e) { toast('この ファイルは よみこめませんでした'); }
    };
    r.readAsText(file);
  }

  function applyCalm() { document.body.classList.toggle('calm', !!S().calm); }
  function bindGear() {
    const gear = $('#gear'); let t = null;
    const cancel = () => { clearTimeout(t); gear.classList.remove('pressing'); };
    gear.addEventListener('pointerdown', e => { e.preventDefault(); gear.classList.add('pressing'); t = setTimeout(() => { cancel(); openSettings(); }, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, cancel));
    gear.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.shiftKey && (e.key === 'S' || e.key === 's') && !$('#settings').classList.contains('open')) openSettings();
      if (e.key === 'Escape' && $('#settings').classList.contains('open')) closeSettings();
    });
    $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
  }
  function makeTouchIcon() {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180; const g = c.getContext('2d');
      g.fillStyle = '#4DABF7'; g.fillRect(0, 0, 180, 180);
      g.font = '118px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('👍', 90, 98);

    } catch (e) { /* 無視 */ }
  }

    applyCalm(); bindGear(); makeTouchIcon();
    if (canSpeak) { loadVoice(); if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; }
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (screen === 'play' || screen === 'pack')) keepAwake(); });
    window.addEventListener('resize', () => { if (screen === 'play') placeRunner(false); });
    $('#whoChip').addEventListener('click', () => { if ((screen === 'start' || screen === 'choose') && store.profiles.length > 1 && tapOk(500)) { sfx.tap(); renderWho(); } });
    // 同じ日の とちゅうの チャレンジは つづきから
    if (session && session.date === today() && Date.now() - session.t < 3 * 3600 * 1000 && store.profiles.some(p => p.id === session.pid) &&
        (session.type === 'pack' ? Object.keys(session.got || {}).length < session.acts.length : session.done < session.marks.length)) {
      store.currentId = session.pid; curCid = session.cid; session.got = session.got || {};
      if (session.type === 'pack') renderPack(); else renderPlay();
    } else {
      session = null; saveSession();
      if (store.profiles.length > 1) renderWho(); else home();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
